# Conversation QA and Compliance Scorecard (E3) runtime configuration.
#
# Loaded by `src/conversation_qa_scorecard/config.py`. Point at a different file with
# CONVQA_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY resolves to empty (an operator who emptied a value expressed an intent, and it
# names nothing), and a set value wins. This file holds env var NAMES and non-secret defaults
# only: no secret value is ever committed here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${CONVQA_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${CONVQA_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${CONVQA_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${CONVQA_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound CONVQA_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# The score pack: the mandated wordings, accepted paraphrases, ordering constraints, timing
# windows, severities, citations and cue lexicons, per market. Empty selects the reference pack
# shipped inside the package. A bank tightens its own QA policy by pointing this at its own file
# (practice B4), never by editing the scoring engine, which knows no market and no wording.
score_pack_path: ${CONVQA_SCORE_PACK:-}

# An optional SIBLING disclosure pack: the `kind: disclosure` artifact the contact-centre copilot
# (E1, contact-centre-conversations) reminds an agent from. Point this at the same file the copilot reads
# and a market's disclosure wording is reviewed ONCE: the copilot reminds from it and this
# scorecard grades against it, so a bank cannot tighten a wording in one and grade against the
# other. It SUPPLEMENTS the pack above and never replaces it, because it carries no ordering
# constraint and no named regulator instrument; an obligation configured in both refuses rather
# than picking a winner.
sibling_disclosure_pack_path: ${CONVQA_SIBLING_DISCLOSURE_PACK:-}

# The tenant-scoped scorecard store. ":memory:" is the ephemeral default the gate uses; a
# deployment points this at a durable path. The domain authorises every read against the
# VERIFIED principal's tenant and answers 403, never 404.
scorecard_path: ${CONVQA_SCORECARD_PATH:-:memory:}

# Directory of offline transcript fixtures the local transcript source reads. Empty selects the
# obviously synthetic set shipped inside the package, which is what the gate and the demo use.
transcript_fixture_path: ${CONVQA_TRANSCRIPT_FIXTURES:-}

# The offline warehouse export target (JSON Lines). Empty keeps the export in memory, which is
# right for the gate and wrong for anything durable.
warehouse_path: ${CONVQA_WAREHOUSE_PATH:-}

# The managed warehouse target, "project.dataset.table". Empty makes the managed export REFUSE
# rather than invent a destination, so an analytics feed cannot silently go nowhere.
warehouse_table: ${CONVQA_WAREHOUSE_TABLE:-}

# The managed narration model. It restates findings the engine already decided and produces no
# number and no verdict; a draft that mentions a figure the engine did not publish is discarded.
narration_model: ${CONVQA_NARRATION_MODEL:-gemini-3.5-flash}

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: conversation_qa_scorecard.adapters.local.audit:LocalAuditAdapter
    gcp: conversation_qa_scorecard.adapters.gcp.audit:CloudAuditAdapter
    onprem: conversation_qa_scorecard.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: conversation_qa_scorecard.adapters.local.identity:LocalIdentityAdapter
    gcp: conversation_qa_scorecard.adapters.gcp.identity:IapIdentityAdapter
    onprem: conversation_qa_scorecard.adapters.onprem.identity:OnPremIdentityAdapter
  narration:
    local: conversation_qa_scorecard.adapters.local.narration:LocalNarrator
    gcp: conversation_qa_scorecard.adapters.gcp.narration:GeminiNarrator
    onprem: conversation_qa_scorecard.adapters.onprem.narration:OnPremNarrator
  review_router:
    local: conversation_qa_scorecard.adapters.local.review_router:LocalReviewRouter
    gcp: conversation_qa_scorecard.adapters.gcp.review_router:CloudReviewRouter
    onprem: conversation_qa_scorecard.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the agent-observability collector when
  # it is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: conversation_qa_scorecard.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: conversation_qa_scorecard.adapters.gcp.tracer:CloudTracerAdapter
    onprem: conversation_qa_scorecard.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (model-quality-gate). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: conversation_qa_scorecard.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: conversation_qa_scorecard.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: conversation_qa_scorecard.adapters.onprem.evaluation:OnPremEvalAdapter
  scorecard_store:
    local: conversation_qa_scorecard.adapters.local.scorecard_store:LocalScorecardStore
    gcp: conversation_qa_scorecard.adapters.gcp.scorecard_store:FirestoreScorecardStore
    onprem: conversation_qa_scorecard.adapters.onprem.scorecard_store:OnPremScorecardStore
  signal_classifier:
    local: conversation_qa_scorecard.adapters.local.signals:LocalSignalClassifier
    gcp: conversation_qa_scorecard.adapters.gcp.signals:GeminiSignalClassifier
    onprem: conversation_qa_scorecard.adapters.onprem.signals:OnPremSignalClassifier
  transcription:
    local: conversation_qa_scorecard.adapters.local.transcription:FixtureTranscriptSource
    gcp: conversation_qa_scorecard.adapters.gcp.transcription:BatchTranscriptSource
    onprem: conversation_qa_scorecard.adapters.onprem.transcription:OnPremTranscriptSource
  warehouse:
    local: conversation_qa_scorecard.adapters.local.warehouse:LocalWarehouseExport
    gcp: conversation_qa_scorecard.adapters.gcp.warehouse:BigQueryWarehouseExport
    onprem: conversation_qa_scorecard.adapters.onprem.warehouse:OnPremWarehouseExport
