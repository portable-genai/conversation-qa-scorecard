[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversation-qa-scorecard"
version = "0.0.1"
description = "Post-contact deterministic conversation QA and compliance scorecard with cited disposition."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]

# The catalog commons, pinned by tag (no build-time coupling: a deliberate per-repo bump). Each
# package carries its own release line, so each has its own cookiecutter variable. The managed
# cloud SDKs live in the [gcp] extra so the local/onprem gate installs none of them.
#
# `review-kit` is not optional: rule R8 says a producer that sets `requires_human_review`
# MUST route the item to the Hrz7 Human-Review console rather than terminate the escalation in a
# per-repo boolean, and the ReviewRouterPort adapters are bound in EVERY profile.
#
# `speech-lexicon-kit` is the shared speech kernel (transcript / speaker-turn / word-offset /
# channel-role / redaction-span types, the speech ports, locale-sensitive normalisation, phrase
# matching and ordered-phrase adherence). It is PINNED, never vendored: three sibling systems
# have to agree on what "the agent read the disclosure at turn 4, characters 12 to 34" means,
# and a copy-pasted kernel is how they stop agreeing. The PHRASES stay here, in the score packs,
# because a required wording is reviewed vertical policy on a per-market schedule.
dependencies = [
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  "hex-service-kit[fastapi] @ git+https://github.com/portable-genai/hex-service-kit@v0.0.5",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  "speech-lexicon-kit @ git+https://github.com/portable-genai/speech-lexicon-kit@v0.0.1",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The SDK-free dev/test/CI toolchain. Ruff is pinned EXACTLY so formatting never drifts.
dev = [
  "ruff==0.16.3",
  "mypy>=1.10",
  "pytest>=8.2",
  "types-PyYAML>=6.0",
]
# Managed cloud SDKs (lazy-imported by the gcp adapters). NOT installed by the local gate.
gcp = [
  # The OpenTelemetry tracer implementation, from the commons. Only a deployed
  # profile exports spans: the tracer PORT and the log formatter are in the commons
  # CORE, so the offline gate binds and logs with none of this installed.
  "hex-service-kit[otel] @ git+https://github.com/portable-genai/hex-service-kit@v0.0.5",
  "google-cloud-logging>=3.0",
  "google-auth>=2.0",
]

[project.scripts]
conversation_qa_scorecard = "conversation_qa_scorecard.cli.main:main"

[project.urls]
Homepage = "https://github.com/portable-genai/conversation-qa-scorecard"
Source = "https://github.com/portable-genai/conversation-qa-scorecard"

# The commons are pinned by git+https (direct references); allow them for this project.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_qa_scorecard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The test-support package sorts into its own section, AFTER the first-party package. Without
# this, `import conversation_qa_scorecard` and `import tests` share a section and their
# order depends on how the package name happens to sort against the word "tests": a repo
# rendered with a later-sorting name would need a different (and only different) import order.
known-local-folder = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The managed SDKs are LAZY imports inside methods and are not installed by the SDK-free dev
# toolchain, so mypy's verdict about them used to depend on what happened to be in the venv:
# absent it reported `import-not-found`, present-but-unstubbed it reported `import-untyped`, and
# a `# type: ignore[import-not-found]` written for the first became an `unused-ignore` ERROR
# under the second. `mypy src` was therefore red for any developer who had google-auth installed
# for some other reason, and it went red the moment this repo's own IAP negative matrix needed
# the verifier present. One declaration here, matching the rest of the catalog, so the type
# check says the same thing either way.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The demo scripts are importable from the suite, so `tests/unit/test_demo_surface.py` can drive
# the real demo instead of asserting that some files exist. Declared here rather than with a
# `sys.path` insert in a conftest: a path hack is invisible to the reader of the failing test.
#
# `scripts` is deliberately NOT added to `[tool.ruff] src`. If it were, a sibling import such as
# `import demo` would share an isort section with `import <package>`, and the correct import
# order would depend on how the rendered package name sorts against the word "demo". Same trap
# as `known-local-folder` below solves for `tests`.
pythonpath = ["scripts"]
markers = [
  "integration: tests that need live cloud services (deselected by default)",
]
